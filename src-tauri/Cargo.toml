[package]
name = "asd-gui"
version = "2.3.2"
description = "ASD GUI Tauri 2 wrapper"
edition = "2021"
authors = ["ASD Team"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [], default-features = false }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
anyhow = "1.0"
which = "6.0"