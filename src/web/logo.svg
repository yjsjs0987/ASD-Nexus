<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512"
     role="img" aria-labelledby="title desc">
  <title id="title">1+3 Fractal Delta Formation — Spaced</title>
  <desc id="desc">One large lead delta dart and three smaller trailing darts, aligned along a 45-degree northeast axis with increased spacing between the trailing wing darts.</desc>

  <rect width="512" height="512" fill="#000000"/>

  <!-- The formation is recentered after spreading the two outer trailing darts. -->
  <g id="formation" transform="translate(7 -7)">
    <!-- Lead dart: 175 px nose-to-wingtip length; 27-degree sweep; 28% tail notch. -->
    <g id="lead-dart" transform="translate(409.331 102.669) rotate(135)">
      <polygon points="0,0 175,89.167 126,0" fill="#FFFFFF"/>
      <polygon points="0,0 126,0 175,-89.167" fill="#E5E5E5" fill-opacity="0.75"/>
    </g>

    <!-- Center trailing dart: 72 px long. -->
    <g id="center-trailing-dart" transform="translate(271.446 240.554) rotate(135)">
      <polygon points="0,0 72,36.686 51.84,0" fill="#FFFFFF" fill-opacity="0.80"/>
      <polygon points="0,0 51.84,0 72,-36.686" fill="#D9D9D9" fill-opacity="0.50"/>
    </g>

    <!-- Upper-left wing dart: moved 14 px outward on both axes. -->
    <g id="upper-left-trailing-dart" transform="translate(165.522 212.405) rotate(135)">
      <polygon points="0,0 72,36.686 51.84,0" fill="#FFFFFF" fill-opacity="0.70"/>
      <polygon points="0,0 51.84,0 72,-36.686" fill="#D9D9D9" fill-opacity="0.45"/>
    </g>

    <!-- Lower-right wing dart: mirrored outward movement. -->
    <g id="lower-right-trailing-dart" transform="translate(299.595 346.478) rotate(135)">
      <polygon points="0,0 72,36.686 51.84,0" fill="#FFFFFF" fill-opacity="0.70"/>
      <polygon points="0,0 51.84,0 72,-36.686" fill="#D9D9D9" fill-opacity="0.45"/>
    </g>
  </g>
</svg>
